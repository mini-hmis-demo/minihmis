name: Release image

# Publishes ghcr.io/<owner>/minihmis:<version> when a release tag is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python3 -m unittest discover -s tests
      - name: Check tag matches VERSION file
        id: version
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/minihmis:${{ steps.version.outputs.version }}
